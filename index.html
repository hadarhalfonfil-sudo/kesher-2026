<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שומרים על קשר 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:        #5bbcbf;
      --teal-light:  #e8f6f6;
      --teal-mid:    #a8d8d9;
      --yellow:      #f9e784;
      --yellow-light:#fefae8;
      --green-light: #eef7ef;
      --pink-light:  #fdf0f4;
      --lavender:    #f0eefa;
      --peach:       #fef3ec;
      --cream:       #fdfaf4;
      --text:        #3a4a4b;
      --text-light:  #7a9a9b;
      --white:       #ffffff;
      --radius-lg:   22px;
      --radius-md:   14px;
      --radius-sm:   10px;
      --shadow-sm:   0 2px 10px rgba(91,188,191,.10);
      --shadow-md:   0 6px 22px rgba(91,188,191,.15);
      --shadow-lg:   0 14px 40px rgba(91,188,191,.20);
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(160deg,
        #e8f6f6 0%,
        #fefae8 30%,
        #fdf0f4 60%,
        #f0eefa 85%,
        #eef7ef 100%);
      min-height: 100vh;
      padding: 28px 16px 70px;
      color: var(--text);
    }

    .page { max-width: 860px; margin: 0 auto; }

    /* ── HERO ── */
    .hero {
      background: #bde5e7;
      border-radius: var(--radius-lg);
      padding: 0;
      box-shadow: 0 14px 44px rgba(91,188,191,.28);
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      top: -40px; right: -40px;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      bottom: -60px; left: -60px;
    }

    /* logo strip at top */
    .hero-logo-bar {
      display: flex;
      justify-content: center;
      padding: 20px 0 10px;
      position: relative;
      z-index: 2;
    }
    .hero-logo-bar img {
      height: 72px;
      width: auto;
      background: transparent;
      border-radius: 0;
      padding: 0;
    }

    .hero-body {
      text-align: center;
      padding: 10px 28px 34px;
      position: relative;
      z-index: 2;
    }
    .hero-body h1 {
      color: #2a6b6e;
      font-size: clamp(26px, 5.5vw, 42px);
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,.08);
      letter-spacing: -.5px;
      margin-bottom: 8px;
    }
    .hero-body p {
      color: rgba(255,255,255,.92);
      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 400;
    }

    /* ── CARD ── */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 28px 26px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1.5px solid rgba(91,188,191,.18);
      transition: box-shadow .35s, transform .35s;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 700;
      color: #2d7577;
    }
    .card-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-light);
      margin-top: -14px;
      margin-bottom: 18px;
      padding-right: 62px;
    }

    .badge {
      width: 46px; height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #5bbcbf, #3a9da2);
      display: flex; align-items: center; justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 14px rgba(91,188,191,.35);
      flex-shrink: 0;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .card:hover .badge { transform: scale(1.12) rotate(7deg); }

    /* ── INPUTS ── */
    label.field-label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .field { margin-bottom: 16px; }

    input[type=text], textarea {
      width: 100%;
      padding: 15px 17px;
      border: 2px solid #daf0f0;
      border-radius: var(--radius-md);
      font-family: 'Heebo', sans-serif;
      font-size: 17px;
      background: #f8fdfd;
      color: var(--text);
      transition: border-color .3s, box-shadow .3s, transform .25s;
      outline: none;
    }
    input[type=text]:focus, textarea:focus {
      border-color: var(--teal);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(91,188,191,.13);
      transform: translateY(-1px);
    }
    textarea { resize: vertical; min-height: 118px; line-height: 1.8; font-size: 17px; }

    /* ── TOP META ROW ── */
    .meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media(max-width:520px){ .meta-row { grid-template-columns: 1fr; } }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Heebo', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .3s, box-shadow .3s;
    }
    .btn:hover  { transform: translateY(-3px); }
    .btn:active { transform: translateY(-1px); }

    .btn-teal {
      background: linear-gradient(135deg, #5bbcbf, #3a9da2);
      color: #fff;
      box-shadow: 0 5px 14px rgba(91,188,191,.38);
    }
    .btn-teal:hover { box-shadow: 0 8px 22px rgba(91,188,191,.5); }

    .btn-purple {
      background: linear-gradient(135deg, #9b8ed4, #7b6db8);
      color: #fff;
      box-shadow: 0 5px 14px rgba(123,109,184,.35);
    }
    .btn-purple:hover { box-shadow: 0 8px 22px rgba(123,109,184,.5); }

    /* ── PHOTOS ── */
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 13px;
      margin-top: 15px;
    }
    .photo-wrap {
      position: relative;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
      transition: transform .3s;
    }
    .photo-wrap:hover { transform: scale(1.06); }
    .photo-wrap img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .photo-remove {
      position: absolute;
      top: 7px; right: 7px;
      width: 27px; height: 27px;
      background: rgba(220,50,50,.88);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s;
    }
    .photo-remove:hover { transform: scale(1.2); }

    /* ── CHIPS ── */
    .chip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #eef7f7, #f0eefa);
      border: 1.5px solid rgba(91,188,191,.20);
      border-radius: var(--radius-md);
      padding: 12px 15px;
      margin-top: 10px;
      transition: background .25s, transform .25s;
    }
    .chip:hover { background: linear-gradient(135deg, #d8eeee, #e4ddf7); transform: translateX(-4px); }
    .chip-icon { font-size: 20px; flex-shrink: 0; }
    .chip-body { flex: 1; min-width: 0; }
    .chip-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .chip-url  { font-size: 12px; color: #2a7abf; word-break: break-all; text-decoration: underline; cursor: pointer; display: block; }
    .chip-remove {
      width: 25px; height: 25px;
      background: rgba(220,50,50,.88);
      color: #fff; border: none;
      border-radius: 50%; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform .2s;
    }
    .chip-remove:hover { transform: scale(1.18); }

    /* ── MEDIA FILES (mp3 / mp4) ── */
document.getElementById(

/* ── MODAL ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.40);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%; max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
    .modal h3 { font-size: 19px; font-weight: 700; margin-bottom: 16px; color: #2d7577; }
    .modal .field { margin-bottom: 13px; }
    .modal-actions { display: flex; gap: 11px; margin-top: 18px; justify-content: flex-end; }
    .btn-cancel { background: #f0f4f4; color: var(--text); box-shadow: none; }
    .btn-cancel:hover { background: #e4ebeb; transform: none; }
    .btn-confirm {
      background: linear-gradient(135deg, #5bbcbf, #3a9da2);
      color: #fff;
      box-shadow: 0 4px 12px rgba(91,188,191,.35);
    }

    /* ── GENERATE BUTTONS ── */
    .gen-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 38px;
    }
    .btn-gen {
      padding: 19px;
      border: none;
      border-radius: 18px;
      font-family: 'Heebo', sans-serif !important;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 11px;
      transition: transform .35s, box-shadow .35s;
    }
    .btn-gen:hover  { transform: translateY(-4px); }
    .btn-gen:active { transform: translateY(-2px); }
    .btn-pdf {
      background: linear-gradient(135deg, #5bbcbf, #3a9da2);
      box-shadow: 0 8px 28px rgba(91,188,191,.40);
    }
    .btn-pdf:hover { box-shadow: 0 14px 40px rgba(91,188,191,.55); }
    .btn-docx {
      background: linear-gradient(135deg, #9b8ed4, #7b6db8);
      box-shadow: 0 8px 28px rgba(123,109,184,.38);
    }
    .btn-docx:hover { box-shadow: 0 14px 40px rgba(123,109,184,.52); }

    /* ── NOTE ── */
    .note {
      margin-top: 30px;
      padding: 22px 26px;
      background: rgba(255,255,255,.88);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .note p { font-size: 14.5px; color: var(--text-light); line-height: 1.7; }
    .note strong { color: var(--text); }

    /* footer logo */
    .footer-logo {
      display: flex;
      justify-content: center;
      margin-top: 28px;
      padding: 20px;
    }
    .footer-logo img {
      height: 64px;
      width: auto;
      opacity: 0.82;
      transition: opacity .3s;
    }
    .footer-logo img:hover { opacity: 1; }

    /* farewell card */
    .farewell-card {
      background: linear-gradient(135deg, #e8f6f6, #f0eefa);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-top: 20px;
      text-align: center;
      border: 1.5px solid rgba(91,188,191,.25);
      box-shadow: var(--shadow-sm);
    }
    .farewell-text {
      font-size: 18px;
      font-weight: 700;
      color: #2d7577;
      margin-bottom: 10px;
    }
    .farewell-sign {
      font-size: 16px;
      color: var(--text-light);
      font-weight: 500;
    }
    .farewell-blank {
      color: var(--text);
      letter-spacing: 2px;
    }

    @media(max-width:560px){
      .card { padding: 20px 16px; }
      .card-header { font-size: 16px; }
      .badge { width: 42px; height: 42px; font-size: 19px; }
      .gen-row { grid-template-columns: 1fr; }
      .btn-gen { font-size: 15px; padding: 16px; }
    }
  </style>
</head>

<!-- MODAL -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h3>🎵 הוספת שיר</h3>
    <div class="field">
      <label class="field-label" for="modal-name">שם השיר</label>
      <input type="text" id="modal-name" placeholder="לדוגמה: גשם גשם..." />
    </div>
    <div class="field">
      <label class="field-label" for="modal-url">קישור ליוטיוב</label>
      <input type="text" id="modal-url" placeholder="https://youtube.com/..." />
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">ביטול</button>
      <button class="btn btn-confirm" onclick="confirmModal()">הוספה ✓</button>
    </div>
  </div>
</div>

<script>
/* ── STATE ── */
const state = { photos: [], songs: [] };

/* ── HELPERS ── */
function renderPhotos() {
  var grid = document.getElementById('photos-grid');
  if (!grid) return;
  grid.innerHTML = '';
  state.photos.forEach(function(p) {
    var wrap = document.createElement('div');
    wrap.className = 'photo-wrap';
    wrap.innerHTML = '<img src="' + p.src + '" alt="תמונה"/>' +
      '<button class="photo-remove" onclick="removePhoto(\'' + p.id + '\')">✕</button>';
    grid.appendChild(wrap);
  });
}
function removePhoto(id) {
  state.photos = state.photos.filter(function(p){ return p.id != id; });
  renderPhotos();
}

function renderSongs() {
  var el = document.getElementById('songs-list');
  if (!el) return;
  el.innerHTML = '';
  // show/hide the card
  var card = document.getElementById('songs-card');
  if (card) card.style.display = state.songs.length ? '' : 'none';
  state.songs.forEach(function(s) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML =
      '<span class="chip-icon">🎵</span>' +
      '<div class="chip-body"><div class="chip-name">' + s.name + '</div>' +
      '<a class="chip-url" href="' + s.url + '" target="_blank">' + s.url + '</a></div>' +
      '<button class="chip-remove" onclick="removeSong(\'' + s.id + '\')">✕</button>';
    el.appendChild(chip);
  });
}
function removeSong(id) {
  state.songs = state.songs.filter(function(s){ return s.id != id; });
  renderSongs();
}


/* ── MODAL ── */
function openModal() {
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-url').value  = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('modal-name').focus(); }, 80);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function confirmModal() {
  var name = document.getElementById('modal-name').value.trim();
  var url  = document.getElementById('modal-url').value.trim();
  if (!name || !url) { alert('נא למלא שם וקישור'); return; }
  state.songs.push({ id: Date.now(), name: name, url: url });
  renderSongs();
  closeModal();
}

/* ── INIT (after DOM ready) ── */
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('kg-date').value = new Date().toLocaleDateString('he-IL');

  // עדכון שם הגן במלבן פרידה
  document.getElementById('kg-name').addEventListener('input', function() {
    var nameEl = document.getElementById('farewell-gan-name');
    if (nameEl) {
      nameEl.textContent = this.value ? this.value : '_______________';
    }
  });

  document.getElementById('photos-input').addEventListener('change', function(e) {
    Array.from(e.target.files).forEach(function(file) {
      var blobUrl = URL.createObjectURL(file);
      state.photos.push({ id: Date.now() + Math.random(), src: blobUrl, file: file });
      renderPhotos();
    });
    e.target.value = '';
  });


  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === e.currentTarget) closeModal();
  });
});

/* ── PDF ── */
function generatePDF() {
  // If photos are blob URLs, convert to base64 first, then build PDF
  var blobPhotos = state.photos.filter(function(p){ return p.src && p.src.startsWith('blob:'); });
  if (blobPhotos.length > 0) {
    var done = 0;
    blobPhotos.forEach(function(p) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        p.src = ev.target.result;
        done++;
        if (done >= blobPhotos.length) { generatePDF(); }
      };
      reader.readAsDataURL(p.file);
    });
    return; // wait for conversion
  }
  var NL = String.fromCharCode(10);
  var kgName   = document.getElementById('kg-name').value || '';
  var kgDate   = document.getElementById('kg-date').value || '';
  var topic    = document.getElementById('topic').value.trim();
  var msgs     = document.getElementById('messages').value.trim();
  var tips     = document.getElementById('tips').value.trim();
  var matiaEl  = document.querySelector('.hero-logo-bar img');
  var heartEl  = document.querySelector('.hero-body h1 img');
  var matiaLogo = matiaEl ? matiaEl.src : '';
  var heartSrc  = heartEl ? heartEl.src : '';

  var photosHTML = '';
  if (state.photos.length) {
    var imgs = state.photos.map(function(p){ return '<img src="' + p.src + '" class="p-photo" loading="eager" decoding="sync"/>'; }).join('');
    photosHTML = '<div class="p-section"><div class="p-sh green">📷 חוויות מהגן</div><div class="p-photos">' + imgs + '</div></div>';
  }

  // ── שירים + קבצי מדיה — כותרת אחת ──
  var songsHTML = '';
  var allSongItems = '';

  if (state.songs.length) {
    allSongItems += state.songs.map(function(s){
      return '<div class="p-song-item">'  +
      '<div class="song-name">♪ ' + s.name + '</div>' +
      '<a href="' + s.url + '" target="_blank" class="song-link">▶ פתיחת השיר</a>' +
      '</div>';
    }).join('');
  }


  if (allSongItems) {
    songsHTML = '<div class="p-section"><div class="p-sh purple">🎵 שירים שלמדנו</div><div class="p-songs-block">' + allSongItems + '</div></div>';
  }


  var metaParts = [];
